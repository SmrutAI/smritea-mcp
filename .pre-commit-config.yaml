# Pre-commit hooks for smritea-mcp
#
# Setup:
#   pip install pre-commit && pre-commit install
#
# Usage:
#   pre-commit run --all-files   # Run all hooks
#   pre-commit run <hook-id>     # Run a specific hook
#
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mcp-format
        name: Format
        entry: make format
        language: system
        files: \.(ts)$
        pass_filenames: false

      - id: mcp-lint
        name: Lint (typecheck + eslint)
        entry: make lint
        language: system
        files: \.(ts)$
        pass_filenames: false

      - id: mcp-build
        name: Build
        entry: make build
        language: system
        files: \.(ts)$
        pass_filenames: false

      - id: mcp-test
        name: Test
        entry: make test
        language: system
        files: \.(ts)$
        pass_filenames: false

      # always_run: the publishable artifact depends on more than .ts files —
      # package.json deps, tsup config, and the repo-local errkit/smritea-sdk
      # sources all shape the bundle, and none of them are reliably matchable
      # with a files: pattern from this repo.
      - id: mcp-smoke
        name: Publish smoke (pack + clean install + run bin)
        entry: make smoke
        language: system
        always_run: true
        pass_filenames: false